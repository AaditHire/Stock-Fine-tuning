[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "finpulse-llm"
version = "0.1.0"
description = "Local financial LLM benchmarking, QLoRA fine-tuning, and evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "FinPulse LLM contributors" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/finpulse_llm"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "unsloth_compiled_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
